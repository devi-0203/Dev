<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E5A4A">
  <title>Pocketwise: monthly budget tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>

    <nav id="tabs" aria-label="Main" hidden>
      <button class="tab" data-action="tab" data-tab="home">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-action="tab" data-tab="expenses">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Expenses</span>
      </button>
      <button class="tab-add" id="add-btn" data-action="open-add" aria-label="Add expense">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-action="tab" data-tab="insights">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
        <span>Insights</span>
      </button>
      <button class="tab" data-action="tab" data-tab="history">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>History</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
